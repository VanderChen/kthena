{{- /*
The name differs from the one a controller manager from before ServingGroup
objects runs under. Helm removes that ServiceAccount when it upgrades, and with
it the credentials of any process of the earlier version that is still alive,
for instance on a node that lost contact. Such a process owns Pods directly
and would act on what this version does to them; without credentials it cannot.
Installing the earlier chart again does the same in the other direction.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kthena-controller-manager-servinggroup
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: kthena-controller-manager
    {{- include "kthena.labels" . | nindent 4 }}
