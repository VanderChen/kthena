# ServingGroups are written by the kthena-controller-manager alone. Users read
# them, and delete one to have it recreated.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kthena-servinggroup-view
  labels:
    rbac.authorization.k8s.io/aggregate-to-view: "true"
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
    {{- include "kthena.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - workload.serving.volcano.sh
    resources:
      - servinggroups
      - servinggroups/status
      - servinggroups/scale
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kthena-servinggroup-edit
  labels:
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
    {{- include "kthena.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - workload.serving.volcano.sh
    resources:
      - servinggroups
    verbs:
      - delete
