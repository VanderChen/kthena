{{- if include "kthena.workload.autoscaler.enabled" . }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kthena-autoscaler
  labels:
    app.kubernetes.io/component: kthena-autoscaler
    {{- include "kthena.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - workload.serving.volcano.sh
    resources:
      - autoscalingpolicies
    verbs:
      - list
      - watch
  - apiGroups:
      - workload.serving.volcano.sh
    resources:
      - autoscalingpolicies/status
    verbs:
      - update
  - apiGroups:
      - workload.serving.volcano.sh
    resources:
      - modelservings
    verbs:
      - list
      - watch
      - patch
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - list
      - watch
{{- end }}
