{{- if and (include "kthena.workload.autoscaler.enabled" .) (include "kthena.workload.autoscaler.leaderElect" .) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kthena-autoscaler
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: kthena-autoscaler
    {{- include "kthena.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kthena-autoscaler
subjects:
  - kind: ServiceAccount
    name: kthena-autoscaler
    namespace: {{ .Release.Namespace }}
{{- end }}
