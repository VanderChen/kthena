# S1: one ServingGroup = 4 Pods x 1 GPU (1 entry + 3 workers). Summed request: 4 GPU.
# Real capacity: k014-m1 (2 nodes x 2 GPU) = 1 group, k014-m2 / k014-m3 (1 node x 8 GPU) = 2 groups.
apiVersion: workload.serving.volcano.sh/v1alpha1
kind: ModelServing
metadata:
  name: s1
  namespace: default
spec:
  schedulerName: default-scheduler
  replicas: 3
  template:
    roles:
      - name: infer
        replicas: 1
        entryTemplate:
          spec:
            terminationGracePeriodSeconds: 0
            containers:
              - name: main
                image: registry.k8s.io/pause:3.10
                resources:
                  limits:
                    nvidia.com/gpu: 1
            volumes:
              - name: scratch
                emptyDir: {}
        workerReplicas: 3
        workerTemplate:
          spec:
            terminationGracePeriodSeconds: 0
            containers:
              - name: main
                image: registry.k8s.io/pause:3.10
                resources:
                  limits:
                    nvidia.com/gpu: 1
