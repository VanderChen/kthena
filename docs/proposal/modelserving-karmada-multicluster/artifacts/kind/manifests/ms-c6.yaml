# C6: valid in a single cluster (maxUnavailable 2 <= replicas 4); no GPU so it does not disturb other scenarios.
apiVersion: workload.serving.volcano.sh/v1alpha1
kind: ModelServing
metadata:
  name: c6
  namespace: default
spec:
  schedulerName: default-scheduler
  replicas: 4
  rolloutStrategy:
    type: ServingGroupRollingUpdate
    rollingUpdateConfiguration:
      maxUnavailable: 2
  template:
    roles:
      - name: infer
        replicas: 1
        entryTemplate:
          spec:
            terminationGracePeriodSeconds: 0
            containers:
              - name: main
                image: registry.k8s.io/pause:3.10
        workerReplicas: 0
