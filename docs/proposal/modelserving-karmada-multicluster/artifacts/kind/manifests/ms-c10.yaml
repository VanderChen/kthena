# C10b: CPU-only ModelServing, 2 groups x 2 Pods; used to watch what happens to running groups when the interpreter is installed later.
apiVersion: workload.serving.volcano.sh/v1alpha1
kind: ModelServing
metadata:
  name: c10
  namespace: default
spec:
  schedulerName: default-scheduler
  replicas: 2
  template:
    roles:
      - name: infer
        replicas: 1
        entryTemplate:
          spec:
            terminationGracePeriodSeconds: 0
            containers:
              - name: main
                image: registry.k8s.io/pause:3.10
                resources:
                  requests:
                    cpu: 100m
        workerReplicas: 1
        workerTemplate:
          spec:
            terminationGracePeriodSeconds: 0
            containers:
              - name: main
                image: registry.k8s.io/pause:3.10
                resources:
                  requests:
                    cpu: 100m
