# Control for G1: a plain Deployment whose Pods request 1 GPU each.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-control
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels: {app: gpu-control}
  template:
    metadata:
      labels: {app: gpu-control}
    spec:
      terminationGracePeriodSeconds: 0
      containers:
        - name: main
          image: registry.k8s.io/pause:3.10
          resources:
            limits:
              nvidia.com/gpu: 1
---
apiVersion: policy.karmada.io/v1alpha1
kind: PropagationPolicy
metadata:
  name: gpu-control
  namespace: default
spec:
  resourceSelectors:
    - apiVersion: apps/v1
      kind: Deployment
      name: gpu-control
  placement:
    clusterAffinity:
      clusterNames: [k014-m1, k014-m2]
    replicaScheduling:
      replicaSchedulingType: Divided
      replicaDivisionPreference: Aggregated
