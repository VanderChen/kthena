# S4: one ServingGroup = 2 Pods x 1 GPU (entry + 1 worker), summed 2 GPU, with a nodeSelector the estimators cannot see.
# k014-m1: only one of its two 2-GPU nodes carries the label -> real capacity 1 group, summary estimate 2 groups.
# k014-m2, k014-m3 (8 GPU, labelled): real capacity = estimate = 4 groups.
apiVersion: workload.serving.volcano.sh/v1alpha1
kind: ModelServing
metadata:
  name: s4
  namespace: default
spec:
  schedulerName: default-scheduler
  replicas: 6
  template:
    roles:
      - name: infer
        replicas: 1
        entryTemplate:
          spec:
            terminationGracePeriodSeconds: 0
            nodeSelector:
              k014/pool: big
            containers:
              - name: main
                image: registry.k8s.io/pause:3.10
                resources:
                  limits:
                    nvidia.com/gpu: 1
        workerReplicas: 1
        workerTemplate:
          spec:
            terminationGracePeriodSeconds: 0
            nodeSelector:
              k014/pool: big
            containers:
              - name: main
                image: registry.k8s.io/pause:3.10
                resources:
                  limits:
                    nvidia.com/gpu: 1
