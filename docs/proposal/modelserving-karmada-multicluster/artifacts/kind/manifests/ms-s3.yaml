# S3: same shape as S1 (4 Pods x 1 GPU), plus a nodeSelector that only nodes of k014-m2 and k014-m3 satisfy.
# The interpreter reports no nodeClaim, so the estimators cannot see it: a stand-in for topology, queue quota
# and other constraints that are invisible to Karmada. In k014-m1 every Pod of a group is unschedulable and holds no GPU.
# Real capacity: k014-m1 = 0 groups (estimate: 1), k014-m2 / k014-m3 = 2 groups.
apiVersion: workload.serving.volcano.sh/v1alpha1
kind: ModelServing
metadata:
  name: s3
  namespace: default
spec:
  schedulerName: default-scheduler
  replicas: 3
  template:
    roles:
      - name: infer
        replicas: 1
        entryTemplate:
          spec:
            terminationGracePeriodSeconds: 0
            nodeSelector:
              k014/pool: big
            containers:
              - name: main
                image: registry.k8s.io/pause:3.10
                resources:
                  limits:
                    nvidia.com/gpu: 1
            volumes:
              - name: scratch
                emptyDir: {}
        workerReplicas: 3
        workerTemplate:
          spec:
            terminationGracePeriodSeconds: 0
            nodeSelector:
              k014/pool: big
            containers:
              - name: main
                image: registry.k8s.io/pause:3.10
                resources:
                  limits:
                    nvidia.com/gpu: 1
