name: Go Check

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "**.svg"
      - "**.png"
      - "docs/**"
      - ".github/**"
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - ".github/**"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
      - name: install helm
        shell: bash
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      - name: helm lint
        shell: bash
        run: |
          helm lint charts/kthena
          # helm lint does not fail on a template that calls fail or renders invalid YAML
          helm template charts/kthena > /dev/null
          helm template charts/kthena --set workload.autoscaler.enabled=false > /dev/null
          helm template charts/kthena --set workload.autoscaler.leaderElect=true --set workload.autoscaler.replicas=2 > /dev/null
          helm template charts/kthena --set-json 'workload.controllerManager.controllers="*,-autoscaler"' > /dev/null
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
      - name: Build Kthena
        shell: bash
        run: |
          make gen-check
      - name: golangci-lint
        shell: bash
        run: |
          make lint
